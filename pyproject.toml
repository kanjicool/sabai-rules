[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sabai-rules"
version = "0.1.0"
description = "LINE Chatbot for Employee Benefits using Hybrid GraphRAG (Neo4j + FAISS + LLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.18.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
